spring.application.name=Secure Web Banking Service

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DB
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Logging SQL
spring.jpa.show-sql=true

# Resilience4j - Rate Limiter
resilience4j.ratelimiter.instances.loginLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.loginLimiter.timeout-duration=0

app.crypto.aes-key=0123456789abcdef0123456789abcdef

