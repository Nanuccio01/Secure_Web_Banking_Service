<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrazione – Secure Web Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 p-3 bank-bg">

<div class="card bank-card w-100" style="max-width: 420px;">
    <div class="bank-header p-4 text-center">
        <div class="app-title fs-4">Secure Web Banking</div>
        <div class="bank-subtitle small">Registrazione nuovo utente</div>
    </div>

    <div class="p-4">
        <div class="mb-2 text-start">
            <label class="form-label">Nome</label>
            <input id="firstName" class="form-control" placeholder="Nome" autocomplete="given-name">
            <div id="firstNameErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-2 text-start">
            <label class="form-label">Cognome</label>
            <input id="lastName" class="form-control" placeholder="Cognome" autocomplete="family-name">
            <div id="lastNameErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-2 text-start">
            <label class="form-label">Email</label>
            <input id="email" class="form-control" placeholder="nome@dominio.it" autocomplete="email">
            <div id="emailErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-2 text-start">
            <label class="form-label">Telefono</label>
            <input id="phone" class="form-control" placeholder="+39 333 1234567" autocomplete="tel">
            <div id="phoneErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-2 text-start">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Password" autocomplete="new-password">
            <div id="passwordErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-2 text-start">
            <label class="form-label">Reinserisci password</label>
            <input id="password2"
                   type="password"
                   class="form-control"
                   placeholder="Reinserisci password"
                   autocomplete="new-password">
            <div id="password2Err" class="text-danger small mt-1"></div>
        </div>

        <div class="mt-2">
            <div class="progress" style="height: 8px;">
                <div id="pwBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
            </div>
            <div class="small mt-1">
                <span class="bank-muted">Sicurezza password:</span>
                <span id="pwLabel" class="fw-semibold">—</span>
            </div>

            <ul class="small bank-muted mt-2 mb-0">
                <li id="ruleLen">Minimo 12 caratteri</li>
                <li id="ruleUpper">Almeno 1 lettera maiuscola</li>
                <li id="ruleLower">Almeno 1 lettera minuscola</li>
                <li id="ruleDigit">Almeno 1 numero</li>
                <li id="ruleSpec">Almeno 1 carattere speciale</li>
            </ul>
        </div>

        <button id="registerBtn" class="btn btn-success w-100 mt-2">Registrati</button>

        <div id="msg" class="text-danger text-center mt-3"></div>

        <div class="text-center mt-3">
            <a href="/login.html">Torna al login</a>
        </div>
    </div>
</div>

<script src="/js/device.js"></script>
<script src="/js/register.js"></script>

<script>
    function evaluatePassword(pw) {
        const rules = {
            len: pw.length >= 12,
            upper: /[A-Z]/.test(pw),
            lower: /[a-z]/.test(pw),
            digit: /\d/.test(pw),
            spec: /[@$!%*?&#^()_+\-={}[\]:;"'<>,.\/\\|~`]/.test(pw)
        };

        const score = Object.values(rules).filter(Boolean).length;

        let label = "Molto debole";
        let percent = 0;

        if (pw.length === 0) { label = "—"; percent = 0; }
        else if (score <= 1) { label = "Molto debole"; percent = 20; }
        else if (score === 2) { label = "Debole"; percent = 40; }
        else if (score === 3) { label = "Media"; percent = 60; }
        else if (score === 4) { label = "Forte"; percent = 80; }
        else { label = "Molto forte"; percent = 100; }

        return { rules, label, percent };
    }

    function setRuleOk(el, ok) {
        if (!el) return;
        el.classList.toggle("text-success", ok);
        el.classList.toggle("text-danger", !ok);
    }

    function updateStrengthUI(pw) {
        const bar = document.getElementById("pwBar");
        const labelEl = document.getElementById("pwLabel");
        const rLen = document.getElementById("ruleLen");
        const rUpper = document.getElementById("ruleUpper");
        const rLower = document.getElementById("ruleLower");
        const rDigit = document.getElementById("ruleDigit");
        const rSpec = document.getElementById("ruleSpec");

        if (!bar || !labelEl) return;

        const { rules, label, percent } = evaluatePassword(pw);

        bar.style.width = percent + "%";
        labelEl.textContent = label;

        bar.classList.remove("bg-danger", "bg-warning", "bg-success");
        if (percent === 0) {
            // barra vuota
        } else if (percent <= 40) bar.classList.add("bg-danger");
        else if (percent <= 60) bar.classList.add("bg-warning");
        else bar.classList.add("bg-success");

        setRuleOk(rLen, rules.len);
        setRuleOk(rUpper, rules.upper);
        setRuleOk(rLower, rules.lower);
        setRuleOk(rDigit, rules.digit);
        setRuleOk(rSpec, rules.spec);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const pwInput = document.getElementById("password");
        if (!pwInput) return;

        updateStrengthUI(pwInput.value || "");
        pwInput.addEventListener("input", () => updateStrengthUI(pwInput.value));
    });
</script>

</body>
</html>
