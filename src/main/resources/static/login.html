<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – Secure Web Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 p-3 bank-bg">

<div class="card bank-card w-100" style="max-width: 420px;">
    <div class="bank-header p-4 text-center">
        <div class="app-title fs-4">Secure Web Banking</div>
        <div class="bank-subtitle small">Accesso area clienti</div>
    </div>

    <div class="p-4">
        <div class="mb-3 text-start">
            <label class="form-label">Email</label>
            <input id="email" class="form-control" placeholder="nome@dominio.it" autocomplete="email">
            <div id="emailErr" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Password" autocomplete="current-password">
            <div id="passwordErr" class="text-danger small mt-1"></div>
        </div>

        <button id="loginBtn" class="btn btn-primary w-100">Login</button>

        <div id="msg" class="text-danger text-center mt-3"></div>

        <div class="text-center mt-3">
            <a href="/register.html">Crea un account</a>
        </div>
    </div>
</div>

<script src="/js/device.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
