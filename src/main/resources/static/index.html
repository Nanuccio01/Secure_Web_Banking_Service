<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Secure Web Banking</title>
</head>
<body>
<h1>Secure Web Banking</h1>

<h2>Login</h2>
<input type="text" id="username" placeholder="Username"><br>
<input type="password" id="password" placeholder="Password"><br>
<input type="text" id="deviceId" placeholder="Device ID"><br>
<button id="loginBtn">Login</button>

<h2>OTP</h2>
<input type="text" id="otp" placeholder="OTP"><br>
<button id="validateOtpBtn">Validate OTP</button>

<h2>Saldo</h2>
<input type="text" id="amount" placeholder="Nuovo saldo"><br>
<button id="updateBalanceBtn">Aggiorna Saldo</button>
<button id="getBalanceBtn">Mostra Saldo</button>

<h2>Accesso Protetto</h2>
<button id="secureAccessBtn">Test Secure</button>

<p id="result"></p>

<script src="login.js"></script>
</body>
</html>
