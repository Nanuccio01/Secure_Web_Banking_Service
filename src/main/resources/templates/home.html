<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home – Secure Web Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 p-3 bank-bg">

<div class="card bank-card w-100" style="max-width: 700px;">

    <div class="bank-header p-4 text-center">
        <div class="app-title fs-4">Secure Web Banking</div>
        <div class="bank-subtitle small" id="welcomeText">Benvenuto</div>
    </div>

    <div class="p-4">

        <div class="text-center mb-3">
            <div class="bank-muted">Il tuo IBAN</div>
            <div class="fw-semibold" id="myIban">Caricamento...</div>

            <div class="bank-muted mt-3">Saldo disponibile</div>
            <div class="display-6 mt-1" id="balanceValue">Caricamento...</div>

            <div class="bank-muted small mt-2" id="infoMsg"></div>
        </div>

        <hr>

        <div class="mb-3">
            <div class="fw-semibold mb-2 text-center">Bonifico</div>

            <input id="toIban" class="form-control mb-2" placeholder="IBAN destinatario (es. IT..)">
            <input id="amount" class="form-control mb-2" placeholder="Importo (es. 10.50)">
            <input id="memo" class="form-control mb-2" placeholder="Causale (opzionale)">

            <button class="btn btn-primary w-100" id="transferBtn" type="button">Invia bonifico</button>

            <div class="text-danger small text-center mt-2" id="transferErr"></div>
            <div class="text-success small text-center mt-2" id="transferOk"></div>
        </div>

        <hr>

        <div class="mb-3">
            <div class="fw-semibold mb-2 text-center">Ultimi movimenti</div>

            <div id="txBox" class="border rounded-3 p-2" style="max-height: 220px; overflow:auto;">
                <div class="bank-muted text-center" id="txStatus">Caricamento...</div>
                <div id="txList" class="small"></div>
            </div>
        </div>

        <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    let MY_IBAN = null;

    function logout() {
        document.cookie = "jwt=; path=/; max-age=0";
        window.location.href = "/login.html";
    }

    function euro(amountStr){
        return "€ " + amountStr;
    }

    async function loadMe(){
        const welcome = document.getElementById("welcomeText");
        const ibanEl = document.getElementById("myIban");

        try{
            const res = await fetch("/api/me", { cache: "no-store" });
            const data = await res.json();
            if (data.error === "UNAUTHORIZED") { window.location.href = "/login.html"; return; }

            if (data.fullName) {
                welcome.textContent = "Benvenuto, " + data.fullName;
            } else {
                welcome.textContent = "Benvenuto";
            }

            ibanEl.textContent = data.iban || "—";
            MY_IBAN = data.iban;
        } catch(e){
            welcome.textContent = "Benvenuto";
            ibanEl.textContent = "Errore caricamento IBAN";
        }
    }

    async function loadBalance(){
        const balEl = document.getElementById("balanceValue");
        const info = document.getElementById("infoMsg");
        try{
            const res = await fetch("/api/balance", { cache: "no-store" });
            const data = await res.json();
            if (data.error === "UNAUTHORIZED") { window.location.href = "/login.html"; return; }
            balEl.textContent = euro(data.balance);
            info.textContent = "";
        } catch(e){
            balEl.textContent = "—";
            info.textContent = "Errore caricamento saldo";
        }
    }

    async function loadTx(){
        const statusEl = document.getElementById("txStatus");
        const listEl = document.getElementById("txList");

        statusEl.textContent = "Caricamento...";
        listEl.innerHTML = "";

        try{
            const res = await fetch("/api/transactions", { cache: "no-store" });
            const data = await res.json();
            if (data.error === "UNAUTHORIZED") { window.location.href = "/login.html"; return; }

            if (!Array.isArray(data) || data.length === 0){
                statusEl.textContent = "Nessun movimento";
                return;
            }

            statusEl.textContent = "";

            listEl.innerHTML = data.map(tx => {
                const when = new Date(tx.createdAt).toLocaleString();

                const isOutgoing = (tx.from === MY_IBAN);
                const sign = isOutgoing ? "−" : "+";
                const color = isOutgoing ? "text-danger" : "text-success";

                return `
                    <div class="border-top pt-2 mt-2">
                        <div class="d-flex justify-content-between align-items-center">
                          <div>
                            <div><strong>${tx.from}</strong> → <strong>${tx.to}</strong></div>
                            <div class="bank-muted">${tx.memo ? tx.memo : ""}</div>
                            <div class="bank-muted">${when}</div>
                          </div>
                          <div class="${color} fw-semibold">
                            ${sign} € ${tx.amount}
                          </div>
                        </div>
                    </div>
                  `;
            }).join("");

        } catch(e){
            statusEl.textContent = "Errore caricamento movimenti";
        }
    }

    document.getElementById("transferBtn").addEventListener("click", async () => {
        const err = document.getElementById("transferErr");
        const ok = document.getElementById("transferOk");
        err.textContent = "";
        ok.textContent = "";

        const toIban = document.getElementById("toIban").value.trim().toUpperCase();
        const amountRaw = document.getElementById("amount").value.trim();
        const memo = document.getElementById("memo").value.trim();

        if(!toIban){ err.textContent = "Inserisci IBAN destinatario."; return; }

        const amountNum = Number(amountRaw.replace(",", "."));
        if(Number.isNaN(amountNum) || amountNum <= 0){ err.textContent = "Importo non valido."; return; }

        try{
            const res = await fetch("/api/transfer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ toIban, amount: amountNum.toFixed(2), memo })
            });

            //Rate Limiter bonifici
            if (res.status === 429) {
                err.textContent = "Troppi bonifici in poco tempo. Riprova tra poco.";
                return;
            }

            const data = await res.json().catch(() => null);

            if (!data || data.error){
                const code = data && data.error ? data.error : "ERROR";
                if(code === "UNAUTHORIZED") { window.location.href = "/login.html"; return; }
                if(code === "DEST_NOT_FOUND") { err.textContent = "IBAN inesistente."; return; }
                if(code === "INSUFFICIENT_FUNDS") { err.textContent = "Fondi insufficienti."; return; }
                if(code === "SAME_USER") { err.textContent = "Non puoi inviare al tuo IBAN."; return; }
                err.textContent = "Bonifico rifiutato (" + code + ").";
                return;
            }

            ok.textContent = "Bonifico inviato.";
            document.getElementById("amount").value = "";
            document.getElementById("memo").value = "";

            await loadBalance();
            await loadTx();
        } catch(e){
            err.textContent = "Errore di rete.";
        }
    });

    async function init(){
        await loadMe();
        await loadBalance();
        await loadTx();
    }

    init();
</script>
</body>
</html>
